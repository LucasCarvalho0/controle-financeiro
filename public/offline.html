<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>Sem conexão | Controle Pro</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 380px);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 auto 22px;
        color: #475569;
        line-height: 1.6;
      }
      button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #1d4ed8;
        color: white;
        font: inherit;
        font-weight: 650;
      }
      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Você está sem conexão</h1>
      <p>
        Conecte-se à internet e tente novamente. Por segurança, os dados
        financeiros não ficam disponíveis offline.
      </p>
      <button type="button" onclick="location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
